<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seres Térmicos — v0.4 Gray-Scott</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#020307;
  color:#ddd;font-family:system-ui,'Segoe UI',sans-serif}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;
       image-rendering:crisp-edges}
.panel{position:fixed;left:16px;bottom:16px;width:min(310px,calc(100vw - 32px));
  padding:13px 15px;background:rgba(4,6,11,.85);border:1px solid rgba(255,255,255,.1);
  border-radius:11px;backdrop-filter:blur(10px);font-size:12px;line-height:1.5}
.panel h1{font-size:14px;margin:0 0 2px;letter-spacing:.04em}
.sub{color:#667;margin-bottom:9px;font-size:11px}
.row{display:flex;align-items:center;gap:8px;margin:4px 0}
.row span{width:62px;color:#99a;font-size:11px}
.row output{width:38px;text-align:right;color:#eee;font-variant-numeric:tabular-nums;font-size:11px}
input[type=range]{flex:1;accent-color:#c87}
.presets{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 6px}
.presets button{background:#0d1018;color:#99a;border:1px solid #2a2f3a;
  border-radius:5px;padding:3px 7px;cursor:pointer;font-size:11px}
.presets button:hover,.presets button.active{background:#1a2030;color:#eee;
  border-color:#c87}
.btn{margin-top:6px;background:#0d1018;color:#bbb;border:1px solid #2a2f3a;
  border-radius:6px;padding:5px 9px;cursor:pointer;font-size:11px;width:100%}
.eq{color:#6af;font:11px monospace;margin-top:8px;padding:7px 9px;
    background:#050810;border-radius:6px;border:1px solid #1a2030;line-height:1.8}
#fps{position:fixed;right:14px;top:12px;color:#444;font:11px monospace}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h1>SERES TÉRMICOS · v0.4</h1>
  <div class="sub">Reacción-difusión Gray-Scott — emergencia sin seres programados</div>

  <div class="presets" id="presets">
    <button data-f="0.035" data-k="0.065" class="active">división</button>
    <button data-f="0.037" data-k="0.060">caótico</button>
    <button data-f="0.055" data-k="0.062">coral</button>
    <button data-f="0.025" data-k="0.055">manchas</button>
    <button data-f="0.060" data-k="0.062">laberinto</button>
  </div>

  <div class="row"><span>Feed F</span>
    <input id="fi" type="range" min="0.010" max="0.090" step="0.001" value="0.035">
    <output id="fo">0.035</output></div>
  <div class="row"><span>Kill k</span>
    <input id="ki" type="range" min="0.040" max="0.075" step="0.001" value="0.065">
    <output id="ko">0.065</output></div>
  <div class="row"><span>Semillas</span>
    <input id="si" type="range" min="1" max="30" step="1" value="8">
    <output id="so">8</output></div>

  <button class="btn" id="reset">reiniciar</button>

  <div class="eq">∂u/∂t = Dᵤ∇²u − u·v² + F(1−u)<br>∂v/∂t = Dᵥ∇²v + u·v² − (F+k)v</div>
</div>
<div id="fps"></div>

<script>
'use strict';

// ── Grilla ──────────────────────────────────────────────────────────────────
const GW = 256, GH = 192;
const N  = GW * GH;

// u = sustrato (alimento), v = organismo
let U  = new Float32Array(N);
let V  = new Float32Array(N);
let Un = new Float32Array(N);
let Vn = new Float32Array(N);

// Difusividades fijas (relación Du >> Dv es esencial para los patrones)
const DU = 0.2100;
const DV = 0.0500;

// ── Canvas ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
canvas.width  = GW;
canvas.height = GH;
const ctx = canvas.getContext('2d');
const imgData = ctx.createImageData(GW, GH);
const px = imgData.data;

// ── Inicialización ──────────────────────────────────────────────────────────
function seed() {
  // Campo base: u=1 (alimento disponible), v=0 (sin organismo)
  U.fill(1);
  V.fill(0);

  const ns = +document.getElementById('si').value;
  // Sembrar manchas de v con algo de ruido
  for (let s = 0; s < ns; s++) {
    const cx = (0.1 + Math.random() * 0.8) * GW | 0;
    const cy = (0.1 + Math.random() * 0.8) * GH | 0;
    const r  = 4 + Math.random() * 4 | 0;
    for (let j = cy-r; j <= cy+r; j++)
      for (let i = cx-r; i <= cx+r; i++) {
        if (i<0||i>=GW||j<0||j>=GH) continue;
        if ((i-cx)*(i-cx)+(j-cy)*(j-cy) > r*r) continue;
        const idx = j*GW+i;
        U[idx] = 0.50 + (Math.random()-0.5)*0.10;
        V[idx] = 0.25 + (Math.random()-0.5)*0.10;
      }
  }
}
seed();

// ── Un paso Gray-Scott ──────────────────────────────────────────────────────
// Esquema explícito de Euler, Δt=1, condiciones periódicas
function step(F, k) {
  const dt = 1.0;
  for (let j = 0; j < GH; j++) {
    const jm = (j - 1 + GH) % GH;
    const jp = (j + 1) % GH;
    for (let i = 0; i < GW; i++) {
      const im = (i - 1 + GW) % GW;
      const ip = (i + 1) % GW;
      const c  = j*GW + i;
      const u = U[c], v = V[c];

      // Laplacianos (condiciones de borde periódicas)
      const lapU = U[jm*GW+i] + U[jp*GW+i] + U[j*GW+im] + U[j*GW+ip] - 4*u;
      const lapV = V[jm*GW+i] + V[jp*GW+i] + V[j*GW+im] + V[j*GW+ip] - 4*v;

      const uvv = u * v * v; // término de reacción (autocatálisis)

      Un[c] = Math.max(0, Math.min(1,  u + dt*(DU*lapU - uvv + F*(1-u))  ));
      Vn[c] = Math.max(0, Math.min(1,  v + dt*(DV*lapV + uvv - (F+k)*v)  ));
    }
  }
  // Intercambiar buffers
  const tmpU=U; U=Un; Un=tmpU;
  const tmpV=V; V=Vn; Vn=tmpV;
}

// ── Colormap ────────────────────────────────────────────────────────────────
// Mapeo sobre v ∈ [0,1]:
// v≈0 → negro profundo (vacío, solo sustrato)
// v≈0.2 → azul/violeta oscuro (organismo naciente)
// v≈0.5 → naranja (organismo activo)
// v≈1.0 → blanco caliente (núcleo, máxima concentración)
function vToRGB(v) {
  let r, g, b;
  if (v < 0.18) {
    const u = v / 0.18;
    r = u * 8; g = 0; b = u * 35;
  } else if (v < 0.40) {
    const u = (v-0.18)/0.22;
    r = 8+u*55; g = u*15; b = 35+u*120;
  } else if (v < 0.65) {
    const u = (v-0.40)/0.25;
    r = 63+u*170; g = 15+u*90; b = 155-u*130;
  } else if (v < 0.85) {
    const u = (v-0.65)/0.20;
    r = 233+u*22; g = 105+u*120; b = 25+u*30;
  } else {
    const u = (v-0.85)/0.15;
    r = 255; g = 225+u*30; b = 55+u*200;
  }
  return [r|0, g|0, b|0];
}

// ── Render ──────────────────────────────────────────────────────────────────
function render() {
  for (let i = 0; i < N; i++) {
    const [r,g,b] = vToRGB(V[i]);
    const p = i*4;
    px[p]=r; px[p+1]=g; px[p+2]=b; px[p+3]=255;
  }
  ctx.putImageData(imgData, 0, 0);
}

// ── Controles ───────────────────────────────────────────────────────────────
const fiEl=document.getElementById('fi'), foEl=document.getElementById('fo');
const kiEl=document.getElementById('ki'), koEl=document.getElementById('ko');
const siEl=document.getElementById('si'), soEl=document.getElementById('so');

fiEl.oninput = () => { foEl.textContent = (+fiEl.value).toFixed(3); syncPreset(); };
kiEl.oninput = () => { koEl.textContent = (+kiEl.value).toFixed(3); syncPreset(); };
siEl.oninput = () => { soEl.textContent = siEl.value; };

document.getElementById('reset').onclick = () => { seed(); };

// Presets
document.getElementById('presets').onclick = e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  fiEl.value = btn.dataset.f; foEl.textContent = (+btn.dataset.f).toFixed(3);
  kiEl.value = btn.dataset.k; koEl.textContent = (+btn.dataset.k).toFixed(3);
  document.querySelectorAll('#presets button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  seed();
};

function syncPreset() {
  const F=+fiEl.value, k=+kiEl.value;
  document.querySelectorAll('#presets button').forEach(b=>{
    b.classList.toggle('active', +b.dataset.f===F && +b.dataset.k===k);
  });
}

// ── Loop principal ───────────────────────────────────────────────────────────
let fpsFrames=0, fpsTime=performance.now(), lastTime=performance.now();

// Semilla inicial → dar unos frames para ver que arranca
function loop(now) {
  const dt = Math.min((now-lastTime)/16.67, 3); lastTime = now;
  const F = +fiEl.value;
  const k = +kiEl.value;

  // Múltiples pasos por frame para acelerar la evolución
  const stepsPerFrame = 8;
  for (let s = 0; s < stepsPerFrame; s++) step(F, k);

  render();

  fpsFrames++;
  if (now - fpsTime > 1000) {
    const fps = Math.round(fpsFrames*1000/(now-fpsTime));
    document.getElementById('fps').textContent =
      `${fps} fps · ${stepsPerFrame * fps} steps/s · ${GW}×${GH}`;
    fpsFrames = 0; fpsTime = now;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
