<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seres Térmicos — Test 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#020307;color:#ddd;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;left:18px;bottom:18px;padding:14px 17px;background:#080a10dd;
    border:1px solid #333;border-radius:10px;font-size:12px}
h1{font-size:16px;margin:0}
.sub{color:#888;margin:4px 0 12px}
#status{font-family:monospace;color:#aaa}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>SERES TÉRMICOS · TEST 3D</h1>
  <div class="sub">Diagnóstico: campo T(x,y,z) → textura 3D → corte central</div>
  <div id="status">iniciando…</div>
</div>
<script>
'use strict';

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {alpha:false, antialias:false});
const status = document.getElementById('status');

if (!gl) {
  status.textContent = 'ERROR: WebGL2 no disponible';
  throw new Error('WebGL2 no disponible');
}

// ── Campo T(x,y,z): gaussiana 3D estática ──────────────────────────────────
const N = 32;
const field = new Float32Array(N * N * N);
for (let z = 0; z < N; z++)
  for (let y = 0; y < N; y++)
    for (let x = 0; x < N; x++) {
      const dx = x - (N-1)*.5, dy = y - (N-1)*.5, dz = z - (N-1)*.5;
      field[x + N*(y + N*z)] = Math.exp(-(dx*dx + dy*dy + dz*dz) / (2*5.5*5.5));
    }

// ── Shaders ────────────────────────────────────────────────────────────────
const VS = `#version 300 es
in vec2 pos;
out vec2 uv;
void main() { uv = pos*.5+.5; gl_Position = vec4(pos,0,1); }`;

const FS = `#version 300 es
precision highp float;
precision highp sampler3D;
uniform sampler3D volume;
in vec2 uv;
out vec4 color;
void main() {
  // Corte transversal z=0.5 del volumen 3D
  float T = texture(volume, vec3(uv, 0.5)).r;
  // Colormap: azul profundo → naranja → blanco
  vec3 c = T < 0.5
    ? mix(vec3(.01,.005,.12), vec3(.9,.25,.02), T*2.0)
    : mix(vec3(.9,.25,.02),   vec3(1.0,.92,.8),  (T-.5)*2.0);
  color = vec4(c, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  throw new Error(gl.getProgramInfoLog(prog));

// ── VAO + buffer ────────────────────────────────────────────────────────────
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

// ── Textura 3D ─────────────────────────────────────────────────────────────
const tex = gl.createTexture();
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_3D, tex);
gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);
// Convertir float [0,1] → RGBA byte (universalmente compatible)
const fieldBytes = new Uint8Array(N * N * N * 4);
for (let i = 0; i < N*N*N; i++) {
  const v = Math.max(0, Math.min(255, field[i] * 255)) | 0;
  fieldBytes[i*4] = v; fieldBytes[i*4+1] = 0; fieldBytes[i*4+2] = 0; fieldBytes[i*4+3] = 255;
}
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
gl.texImage3D(gl.TEXTURE_3D, 0, gl.RGBA, N,N,N, 0, gl.RGBA, gl.UNSIGNED_BYTE, fieldBytes);

const err = gl.getError();
status.textContent = err === gl.NO_ERROR
  ? `✓ WebGL2 OK · textura 3D ${N}³ OK · formato RGBA8`
  : `ERROR WebGL: código ${err}`;

// ── Render ─────────────────────────────────────────────────────────────────
function resize() {
  const d = Math.min(devicePixelRatio||1, 2);
  canvas.width = innerWidth*d; canvas.height = innerHeight*d;
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize', resize); resize();

function render() {
  gl.clearColor(.01,.01,.02,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(prog); gl.bindVertexArray(vao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_3D, tex);
  gl.uniform1i(gl.getUniformLocation(prog,'volume'), 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
render();
</script>
</body>
</html>
