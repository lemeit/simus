<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seres Térmicos — v0.5 FitzHugh-Nagumo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#020307;
  color:#ddd;font-family:system-ui,'Segoe UI',sans-serif}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;
       image-rendering:crisp-edges}
.panel{position:fixed;left:16px;bottom:16px;width:min(320px,calc(100vw - 32px));
  padding:13px 15px;background:rgba(4,6,11,.87);border:1px solid rgba(255,255,255,.09);
  border-radius:11px;backdrop-filter:blur(10px);font-size:12px;line-height:1.5}
.panel h1{font-size:14px;margin:0 0 1px;letter-spacing:.04em}
.sub{color:#556;margin-bottom:8px;font-size:10px}
.row{display:flex;align-items:center;gap:8px;margin:3px 0}
.row span{width:68px;color:#889;font-size:11px}
.row output{width:38px;text-align:right;color:#ddd;font-size:11px;
            font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:#c87}
.presets{display:flex;flex-wrap:wrap;gap:3px;margin:7px 0 5px}
.presets button,.btn{background:#0c0f18;color:#889;border:1px solid #252a36;
  border-radius:5px;padding:3px 8px;cursor:pointer;font-size:11px}
.presets button:hover,.presets button.active{background:#18202e;color:#eee;
  border-color:#c87}
.btn{margin-top:4px;width:100%;color:#aaa}
.eq{color:#6af;font:10.5px monospace;margin-top:7px;padding:6px 8px;
    background:#04060e;border-radius:6px;border:1px solid #151c28;line-height:1.9}
.eq b{color:#adf}
#fps{position:fixed;right:14px;top:12px;color:#333;font:11px monospace}
#hint{position:fixed;right:14px;bottom:14px;color:#334;font:10px system-ui}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h1>SERES TÉRMICOS · v0.5</h1>
  <div class="sub">FitzHugh-Nagumo · ondas espirales · nunca se detiene</div>

  <div class="presets" id="presets">
    <button data-e="0.08" data-b="0.30" data-g="0.80" class="active">espirales</button>
    <button data-e="0.04" data-b="0.35" data-g="0.75">turbulencia</button>
    <button data-e="0.15" data-b="0.25" data-g="0.85">latidos lentos</button>
    <button data-e="0.06" data-b="0.40" data-g="0.70">ondas planas</button>
  </div>

  <div class="row"><span>ε recuperac.</span>
    <input id="ei" type="range" min="0.02" max="0.25" step="0.01" value="0.08">
    <output id="eo">0.08</output></div>
  <div class="row"><span>β offset</span>
    <input id="bi" type="range" min="0.10" max="0.60" step="0.01" value="0.30">
    <output id="bo">0.30</output></div>
  <div class="row"><span>γ amort.</span>
    <input id="gi" type="range" min="0.50" max="1.00" step="0.02" value="0.80">
    <output id="go">0.80</output></div>

  <button class="btn" id="reset">reiniciar</button>
  <button class="btn" id="addseed" style="margin-top:3px">+ sembrar espiral (o clic en pantalla)</button>

  <div class="eq">
    <b>∂u/∂t</b> = Dᵤ∇²u + u − u³/3 − v<br>
    <b>∂v/∂t</b> = ε · (u + β − γv)<br>
    <span style="color:#556">u ∈ [−2,2]: activación térmica<br>
    v: recuperación (memoria)</span>
  </div>
</div>
<div id="fps"></div>
<div id="hint">clic en la pantalla → nueva espiral</div>

<script>
'use strict';

// ── Grilla ───────────────────────────────────────────────────────────────────
const GW = 256, GH = 192;
const N  = GW * GH;

// u: activación térmica ~ [-2, 2]
// v: variable de recuperación (no difunde)
let U  = new Float32Array(N);
let V  = new Float32Array(N);
let Un = new Float32Array(N);
let Vn = new Float32Array(N);

// ── Parámetros numéricos ─────────────────────────────────────────────────────
// FHN forma estándar:
//   ∂u/∂t = Du·∇²u + u − u³/3 − v
//   ∂v/∂t = ε(u + β − γv)
//
// Con estos parámetros (ε=0.08, β=0.1, γ=1.5) el punto fijo u*≈0.2 tiene
// traza del Jacobiano > 0 → punto de silla inestable → ciclo límite (oscilación).
//
// Estabilidad numérica: la cinética es O(1), Du·∇²u con Du=0.5 y Δt=0.1
// cumple la condición de CFL: Du·Δt/Δx² = 0.5·0.1 = 0.05 << 0.25. ✓

const DU = 0.5;
const DT = 0.10;

// ── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
canvas.width  = GW;
canvas.height = GH;
const ctx   = canvas.getContext('2d');
const img   = ctx.createImageData(GW, GH);
const px    = img.data;

// ── Condición inicial: "frente de onda roto" ─────────────────────────────────
// Técnica de Winfree (1972): una onda que se corta a la mitad genera
// un extremo libre que se enrolla en espiral.
//
// u_excitado ≈ +2 (rama derecha del cúbico)
// u_refractario ≈ −1.5 (sistema recuperándose)
// v_alto ≈ +1.5 (variable de recuperación alta → bloquea re-excitación)

function addSpiral(cx, cy, r) {
  r = r || 20;
  for (let j = cy-r; j <= cy+r; j++)
    for (let i = cx-r; i <= cx+r; i++) {
      if (i<0||i>=GW||j<0||j>=GH) continue;
      if ((i-cx)**2+(j-cy)**2 > r*r) continue;
      const k = j*GW+i;
      if (i < cx) {
        // Mitad izquierda: excitada (caliente)
        U[k] = 1.8  + (Math.random()-.5)*.2;
        V[k] = 0.0  + Math.random()*.1;
      } else {
        // Mitad derecha: refractaria (fría)
        U[k] = -1.4 + (Math.random()-.5)*.2;
        V[k] = 1.5  + Math.random()*.1;
      }
    }
}

function reset() {
  // Equilibrio: para β=0.30, γ=0.80 el punto fijo es u*≈-0.8, v*≈-0.625
  // det(J) > 0 y traza > 0 → punto inestable → ciclo límite (oscilación sostenida)
  const beta  = +document.getElementById('bi').value;
  const gamma = +document.getElementById('gi').value;
  // u* se puede aproximar como la raíz de: -0.25u - u³/3 = 0.375 → u*≈-0.8
  // Usamos -0.8 como punto de partida razonable para cualquier preset
  const ueq = -0.75 + beta * 0.2;
  const veq = (ueq + beta) / gamma;
  for (let i=0;i<N;i++) {
    U[i] = ueq + (Math.random()-.5)*.15;
    V[i] = veq + (Math.random()-.5)*.10;
  }
  // Sembrar dos espirales
  addSpiral(GW*.28|0, GH*.40|0, 22);
  addSpiral(GW*.68|0, GH*.60|0, 18);
}
reset();

// ── Paso de integración (Euler explícito) ────────────────────────────────────
function step(eps, beta, gamma) {
  for (let j = 0; j < GH; j++) {
    const jm = (j-1+GH) % GH;
    const jp = (j+1) % GH;
    for (let i = 0; i < GW; i++) {
      const im = (i-1+GW) % GW;
      const ip = (i+1) % GW;
      const k  = j*GW + i;
      const u  = U[k], v = V[k];

      // Laplaciano de u (borde periódico)
      const lapU = U[jm*GW+i] + U[jp*GW+i] + U[j*GW+im] + U[j*GW+ip] - 4*u;

      // FHN: cinética O(1), numéricamente estable con DT=0.1
      const du = DU * lapU  +  u - (u*u*u)/3.0 - v;
      const dv = eps * (u + beta - gamma * v);

      Un[k] = u + DT * du;
      Vn[k] = v + DT * dv;
    }
  }
  const tU=U; U=Un; Un=tU;
  const tV=V; V=Vn; Vn=tV;
}

// ── Colormap ─────────────────────────────────────────────────────────────────
// u ∈ [−2, 2], mapeado a interpretación térmica:
//   u < −1.0  → azul/cyan  (recuperándose, "frío post-excitación")
//   u ≈  0    → negro      (en reposo, "vacío cósmico")
//   u >  0.5  → naranja    (activándose, "caliente")
//   u ≈  2.0  → blanco     (máxima excitación, "núcleo del ser")
function uToRGB(u) {
  // Normalizar: [-2, 2] → [0, 1]
  const t = (u + 2.0) * 0.25; // /4
  let r, g, b;
  if (t < 0.10) {               // muy frío
    const s=t/.10; r=s*10; g=0; b=s*40;
  } else if (t < 0.30) {        // frío (post-excitación)
    const s=(t-.10)/.20; r=10; g=s*120; b=40+s*170;
  } else if (t < 0.48) {        // recuperación → reposo
    const s=(t-.30)/.18; r=10+s*5; g=120-s*120; b=210-s*200;
  } else if (t < 0.56) {        // reposo (negro casi puro)
    const s=(t-.48)/.08; r=15+s*10; g=s*5; b=10+s*5;
  } else if (t < 0.72) {        // activación incipiente
    const s=(t-.56)/.16; r=25+s*180; g=5+s*60; b=15-s*10;
  } else if (t < 0.88) {        // activación plena (naranja)
    const s=(t-.72)/.16; r=205+s*50; g=65+s*140; b=5+s*20;
  } else {                       // máxima activación (blanco caliente)
    const s=(t-.88)/.12; r=255; g=205+s*50; b=25+s*230;
  }
  return [r|0, g|0, b|0];
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  for (let i = 0; i < N; i++) {
    const [r,g,b] = uToRGB(U[i]);
    const p = i<<2;
    px[p]=r; px[p+1]=g; px[p+2]=b; px[p+3]=255;
  }
  ctx.putImageData(img, 0, 0);
}

// ── Controles ──────────────────────────────────────────────────────────────
const eiEl=document.getElementById('ei'), eoEl=document.getElementById('eo');
const biEl=document.getElementById('bi'), boEl=document.getElementById('bo');
const giEl=document.getElementById('gi'), goEl=document.getElementById('go');

eiEl.oninput = ()=>{ eoEl.textContent=(+eiEl.value).toFixed(2); syncPreset(); };
biEl.oninput = ()=>{ boEl.textContent=(+biEl.value).toFixed(2); syncPreset(); };
giEl.oninput = ()=>{ goEl.textContent=(+giEl.value).toFixed(2); syncPreset(); };

document.getElementById('reset').onclick = reset;
document.getElementById('addseed').onclick = ()=>{
  addSpiral((0.1+Math.random()*.8)*GW|0, (0.1+Math.random()*.8)*GH|0, 14+Math.random()*12|0);
};

document.getElementById('presets').onclick = e => {
  const btn = e.target.closest('button[data-e]');
  if (!btn) return;
  eiEl.value=btn.dataset.e; eoEl.textContent=(+btn.dataset.e).toFixed(2);
  biEl.value=btn.dataset.b; boEl.textContent=(+btn.dataset.b).toFixed(2);
  giEl.value=btn.dataset.g; goEl.textContent=(+btn.dataset.g).toFixed(2);
  document.querySelectorAll('#presets button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  reset();
};

function syncPreset() {
  const e=+eiEl.value, b=+biEl.value, g=+giEl.value;
  document.querySelectorAll('#presets button[data-e]').forEach(btn=>{
    btn.classList.toggle('active',
      +btn.dataset.e===e && +btn.dataset.b===b && +btn.dataset.g===g);
  });
}

// Clic en canvas → espiral en esa posición
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  addSpiral(
    ((e.clientX - r.left)  / r.width  * GW) | 0,
    ((e.clientY - r.top)   / r.height * GH) | 0,
    16
  );
});

// ── Loop ──────────────────────────────────────────────────────────────────────
let fpsF=0, fpsT=performance.now();
const SPF = 8; // pasos de física por frame

function loop(now) {
  const eps   = +eiEl.value;
  const beta  = +biEl.value;
  const gamma = +giEl.value;
  for (let s=0; s<SPF; s++) step(eps, beta, gamma);
  render();
  fpsF++;
  if (now-fpsT > 1000) {
    document.getElementById('fps').textContent =
      `${Math.round(fpsF*1000/(now-fpsT))} fps · ${SPF} steps/frame`;
    fpsF=0; fpsT=now;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
